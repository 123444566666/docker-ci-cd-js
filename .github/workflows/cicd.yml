name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Линтер
        run: npm run lint
      - name: Проверка сборки
        run: npm run build

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сформировать теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Сборка образа для сканирования
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: scan-target:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сканирование Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Публикация образа
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
