apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app: next-app
  template:
    metadata:
      labels:
        app: next-app
    spec:
      containers:
        - name: next-app
          image: ghcr.io/123444566666/docker-ci-cd-js:2.0
          ports:
            - containerPort: 3000
